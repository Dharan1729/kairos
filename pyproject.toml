[project]
name = "kairos-context"
version = "0.2.0"
description = "Context assembly for AI coding agents: org, team, project, personal and session knowledge, scope-checked, ranked and fit to a token budget, with a permission-safe cache."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kairos contributors" }]
keywords = ["llm", "agents", "context", "rag", "mcp", "claude-code", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "hnswlib>=0.8",
    "networkx>=3.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "typer>=0.12",
    "watchdog>=4.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "cryptography>=42",
    "psycopg[binary]>=3.1",
]

[project.urls]
Documentation = "https://github.com/Dharan1729/kairos/tree/main/docs"
Source = "https://github.com/Dharan1729/kairos"
Changelog = "https://github.com/Dharan1729/kairos/blob/main/CHANGELOG.md"

[project.scripts]
kairos = "kairos.cli:app"
kairos-mcp = "kairos.mcp_server:main"

[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kairos*"]

[tool.setuptools.package-data]
kairos = ["demo_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a Postgres database in KAIROS_TEST_POSTGRES_URL",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI and Typer use calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"kairos/dashboard.py" = ["E501"]
"benchmarks/dataset.py" = ["E501"]  # prose data reads better unwrapped

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
