# Local Postgres + Kairos. Host ports bind to 127.0.0.1 only and are
# configurable, so this can run next to other stacks:
#   KAIROS_HTTP_PORT=18710 KAIROS_PG_PORT=55439 docker compose -p kairos up -d --build
# Seed the demo org once:  docker compose -p kairos exec kairos kairos seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${KAIROS_PG_PASSWORD:-kairos-local-only}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KAIROS_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      timeout: 5s
      retries: 20

  kairos:
    build: .
    command: sh -c "alembic upgrade head && uvicorn kairos.api:app --host 0.0.0.0 --port 8000"
    environment:
      KAIROS_DATABASE_URL: postgresql://kairos:${KAIROS_PG_PASSWORD:-kairos-local-only}@postgres:5432/kairos
      KAIROS_RATE_LIMIT: ${KAIROS_RATE_LIMIT:-120/minute}
    volumes:
      - hf_cache:/home/kairos/.cache/huggingface
      - kairos_home:/home/kairos/.kairos   # dev keys written by `kairos seed`
    ports:
      - "127.0.0.1:${KAIROS_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  hf_cache:
  kairos_home:
